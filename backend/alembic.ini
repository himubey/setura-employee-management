# Alembic configuration.
#
# Note there is no `sqlalchemy.url` here on purpose — alembic/env.py reads
# DATABASE_URL through app.core.config, so the connection string lives in
# .env only and cannot be committed by accident.

[alembic]
script_location = alembic

# Prefixes new revision filenames with a UTC timestamp, so `ls versions/`
# reads in chronological order instead of by random hash.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Revision files are dated in UTC, so a team spread across timezones still
# agrees on the ordering.
timezone = UTC

prepend_sys_path = .

[post_write_hooks]
# Intentionally none.
#
# Alembic's `exec` hook resolves the executable from PATH, so a `ruff` hook
# here works only when the venv is activated and fails confusingly when
# alembic is invoked as `.venv/bin/alembic`. (`console_scripts` does not help:
# ruff's wheel ships a binary rather than an entry point.)
#
# Format generated migrations with the normal command instead:
#
#     ruff format . && ruff check --fix .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
